services:
  gateway: { build: ../services/gateway, ports: ["8080:8080"], depends_on: [redis, postgres] }
  worker: { build: ../services/worker, depends_on: [redis, postgres] }
  dashboard: { build: ../services/dashboard, ports: ["3000:3000"] }
  redis: { image: redis:7 }
  postgres: { image: postgres:16 }
